<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 900 }
}">
class Component extends DCLogic {
  state = { hasResume: true, theme: "light" };

  componentDidMount() {
    let t = "light";
    try { t = localStorage.getItem("portfolio-theme") || "light"; } catch (e) {}
    this.applyTheme(t);
    const header = document.querySelector("header");
    if (header) {
      window.__pf404Nav = () => {
        if (window.scrollY > 70) header.setAttribute("data-scrolled", "");
        else header.removeAttribute("data-scrolled");
      };
      window.addEventListener("scroll", window.__pf404Nav, { passive: true });
      window.__pf404Nav();
    }
  }

  applyTheme(theme) {
    const r = document.documentElement;
    r.setAttribute("data-theme", theme);
    // the boot script writes these inline for the anti-flash paint;
    // clear them so the html rules own the ground on every toggle
    r.style.removeProperty("background-color");
    r.style.removeProperty("color-scheme");
    try { localStorage.setItem("portfolio-theme", theme); } catch (e) {}
    this.setState({ theme });
  }

  renderVals() {
    const dark = this.state.theme === "dark";
    return {
      hasResume: this.state.hasResume !== false,
      sunDisp: dark ? "none" : "block",
      moonDisp: dark ? "block" : "none",
      toggleTheme: () => this.applyTheme(dark ? "light" : "dark")
    };
  }
}

</script>
