<script type="text/x-dc" data-dc-script data-props="{

  &quot;stepSeconds&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0.8, &quot;min&quot;: 0.4, &quot;max&quot;: 1.6, &quot;step&quot;: 0.1, &quot;unit&quot;: &quot;s&quot;, &quot;tsType&quot;: &quot;number&quot; },

  state = { rects: null, still: false, tick: 0 };

    }

  }

    clearInterval(this.iv);
    this.iv = null;
    window.removeEventListener('resize', this.onResize);

  }

  measure() {
    const frame = this.frame;
    if (!frame) return;
    const fr = frame.getBoundingClientRect();
    const scale = fr.width / 375 || 1;
    const rects = {};
    frame.querySelectorAll('[data-hl],[data-anchor]').forEach((el) => {
      const r = el.getBoundingClientRect();
      const key = el.dataset.hl || ('anchor-' + el.dataset.anchor);
      rects[key] = {
        x: (r.left - fr.left) / scale,
        y: (r.top - fr.top) / scale,
        w: r.width / scale,
        h: r.height / scale
      };
    });
    this.setState({ rects });
  }

  step() { return Math.min(1.6, Math.max(0.4, this.props.stepSeconds ?? 0.8)); }
  zoom() { return Math.min(2, Math.max(1.15, this.props.zoom ?? 1.3)); }

  cues() {
    const s = this.step();
    const v1 = 0.95;
    const end1 = v1 + 3 * s + 0.5;
    const p2 = end1 + 0.35;
    const v2 = p2 + 0.75;
    const end2 = v2 + 3 * s + 0.5;
    const total = end2 + 1.1;
    return { s: s, v1: v1, end1: end1, p2: p2, v2: v2, end2: end2, hold: total - 0.4, total: total };
  }

  frameAt(e) {
    const c = this.cues();
    const s = c.s;
    let p1Var = 'tab-stocks';
    if (e >= c.v1 + 2 * s) p1Var = 'tab-mf';
    else if (e >= c.v1 + s) p1Var = 'tab-fno';
    let p2Var = 'nav-explore';
    if (e >= c.v2 + 2 * s) p2Var = 'nav-portfolio';
    else if (e >= c.v2 + s) p2Var = 'nav-orders';

    let activeTab = 'tab-stocks';
    let activeNav = 'nav-home';
    if (e >= 0.2 && e < c.p2) activeNav = 'nav-portfolio';
    if (e >= c.v1 && e < c.p2) activeTab = p1Var;
    if (e >= c.v2) activeNav = p2Var;

    return {
      p1Fixed: e >= 0.2 && e < c.end1,
      p1Var: e >= c.v1 && e < c.end1,
      p1VarKey: p1Var,
      p1VarLabel: e >= 0.65 && e < c.end1,
      p2Fixed: e >= c.p2 && e < c.hold,
      p2Var: e >= c.v2 && e < c.hold,
      p2VarKey: p2Var,
      p2VarLabel: e >= c.p2 + 0.45 && e < c.hold,

    const raw = (Date.now() - t0) / 1000;

  }

  lensGeom(key) {
    const r = this.state.rects && key ? this.state.rects[key] : null;
    if (!r) return null;
    const tab = key.indexOf('tab-') === 0;
    const padX = tab ? 13 : 11;
    const padY = tab ? 7 : 8;
    return {
      left: r.x - padX,
      top: r.y - padY,
      w: r.w + padX * 2,
      h: r.h + padY * 2,
      cx: r.x + r.w / 2,
      cy: r.y + r.h / 2
    };
  }

  lensStyle(key, on) {
    const accent = this.props.accentColor ?? '#0F8A5F';
    const g = this.lensGeom(key);
    const ease = 'cubic-bezier(.6,.02,.24,1)';
    const base = {
      position: 'absolute',
      pointerEvents: 'none',
      boxSizing: 'border-box',
      overflow: 'hidden',
      background: '#FFFFFF',
      border: '1px solid ' + this.hexA(accent, 0.42),
      borderRadius: '14px',
      boxShadow: '0 6px 20px rgba(16, 24, 40, 0.09)',
      opacity: g && on ? 1 : 0,
      transform: g && on ? 'scale(1)' : 'scale(0.97)',
      transition: 'left .55s ' + ease + ', top .55s ' + ease + ', width .55s ' + ease + ', height .55s ' + ease + ', opacity .45s ease, transform .45s ' + ease
    };
    if (!g) return Object.assign(base, { left: 0, top: 0, width: 0, height: 0 });
    return Object.assign(base, {
      left: g.left + 'px',
      top: g.top + 'px',
      width: g.w + 'px',
      height: g.h + 'px'
    });
  }

  lensInnerStyle(key) {
    const g = this.lensGeom(key);
    const z = this.zoom();
    const base = {
      position: 'absolute',
      left: 0,
      top: 0,
      width: '375px',
      height: '812px',
      transition: 'transform .55s cubic-bezier(.6,.02,.24,1)'
    };
    if (!g) return base;
    return Object.assign(base, {
      transformOrigin: g.cx + 'px ' + g.cy + 'px',
      transform: 'translate(' + (g.w / 2 - g.cx) + 'px, ' + (g.h / 2 - g.cy) + 'px) scale(' + z + ')'
    });
  }

  labelStyle(slot, on) {
    const accent = this.props.accentColor ?? '#0F8A5F';
    const rects = this.state.rects;
    const tabs = rects && rects['anchor-tabs'];
    const nav = rects && rects['anchor-nav'];
    let top = 0;
    if (slot === 'top' && tabs) top = tabs.y + tabs.h + 30;
    if (slot === 'bottom' && nav) top = nav.y - 44;
    const show = !!rects && on;
    return {
      position: 'absolute',
      left: '28px',
      top: top + 'px',
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      fontSize: '12px',
      fontWeight: 600,
      letterSpacing: '0.18em',
      color: accent,
      opacity: show ? 1 : 0,
      transform: show ? 'translateY(0)' : 'translateY(4px)',
      transition: 'opacity .5s ease, transform .5s cubic-bezier(.6,.02,.24,1)',
      pointerEvents: 'none'
    };
  }

  hexA(hex, a) {
    const h = String(hex).replace('#', '');
    const f = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
    const n = parseInt(f, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  tabStyle(active) {
    return {
      padding: '10px 12px 14px',
      fontSize: '16px',
      fontWeight: active ? 600 : 500,
      color: active ? '#101828' : '#98A2B3',
      borderBottom: '2.5px solid ' + (active ? '#101828' : 'transparent'),
      marginBottom: '-1px',
      whiteSpace: 'nowrap',
      transition: 'color .35s ease, border-color .35s ease'
    };
  }

  navStyle(active) {
    return {
      flex: 1,
      display: 'flex',
      flexDirection: 'column',
      alignItems: 'center',
      gap: '5px',
      padding: '4px 0',
      color: active ? '#101828' : '#98A2B3',
      fontWeight: active ? 600 : 500,
      transition: 'color .35s ease'
    };
  }

  renderVals() {
    const rects = this.state.rects;
    const tabs = rects && rects['anchor-tabs'];
    const nav = rects && rects['anchor-nav'];
    const e = this.clock();
    const f = this.state.still
      ? {
          p1Fixed: true, p1Var: true, p1VarKey: 'tab-stocks', p1VarLabel: true,
          p2Fixed: false, p2Var: false, p2VarKey: 'nav-explore', p2VarLabel: false,
          activeTab: 'tab-stocks', activeNav: 'nav-portfolio'
        }
      : this.frameAt(e == null ? 0.5 : e);

    return {
      rootRef: this.rootRef,
      frameRef: this.frameRef,
      tabStocksStyle: this.tabStyle(f.activeTab === 'tab-stocks'),
      tabFnoStyle: this.tabStyle(f.activeTab === 'tab-fno'),
      tabMfStyle: this.tabStyle(f.activeTab === 'tab-mf'),
      tabNewStyle: this.tabStyle(f.activeTab === 'tab-new'),
      navHomeStyle: this.navStyle(f.activeNav === 'nav-home'),
      navExploreStyle: this.navStyle(f.activeNav === 'nav-explore'),
      navToolsStyle: this.navStyle(f.activeNav === 'nav-tools'),
      navOrdersStyle: this.navStyle(f.activeNav === 'nav-orders'),
      navPortfolioStyle: this.navStyle(f.activeNav === 'nav-portfolio'),
      tabsCopyStyle: {
        position: 'absolute',
        left: 0,
        top: (tabs ? tabs.y : 0) + 'px',
        width: '375px',
        background: '#FFFFFF'
      },
      navCopyStyle: {
        position: 'absolute',
        left: 0,
        top: (nav ? nav.y : 0) + 'px',
        width: '375px',
        padding: '10px 8px 0',
        boxSizing: 'border-box',
        background: '#FFFFFF'
      },
      p1FixedLens: this.lensStyle('nav-portfolio', f.p1Fixed),
      p1FixedLensInner: this.lensInnerStyle('nav-portfolio'),
      p1VarLens: this.lensStyle(f.p1VarKey, f.p1Var),
      p1VarLensInner: this.lensInnerStyle(f.p1VarKey),
      p2FixedLens: this.lensStyle('tab-stocks', f.p2Fixed),
      p2FixedLensInner: this.lensInnerStyle('tab-stocks'),
      p2VarLens: this.lensStyle(f.p2VarKey, f.p2Var),
      p2VarLensInner: this.lensInnerStyle(f.p2VarKey),
      p1FixedLabel: this.labelStyle('bottom', f.p1Fixed),
      p1VarLabel: this.labelStyle('top', f.p1VarLabel),
      p2FixedLabel: this.labelStyle('top', f.p2Fixed),
      p2VarLabel: this.labelStyle('bottom', f.p2VarLabel)
    };
  }
}
</script>
</body>
</html>
