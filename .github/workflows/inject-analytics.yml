name: Inject analytics tags

# Finds every .html file in the repo, removes any old Umami Cloud tag,
# and adds the self-hosted tag if missing. No folder name assumptions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest

    # One source of truth for both steps below. Changing the tracked site is
    # a two-line edit here — and the guard makes sure every page follows.
    env:
      UMAMI_HOST: umami-swart-five.vercel.app
      UMAMI_ID: 5a59e8a0-e996-42f4-a248-fcf582413c76

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # analytics.js was silently flattened once already: an "Add files via
      # upload" commit replaced the 160-line event script with a 15-line stub,
      # and three weeks of scroll-depth, section-reached and time-on-page went
      # missing before anyone noticed. api/stats.js reads these names by hand,
      # so a missing one is not a lint warning — it is a dead chart. Fail loud.
      - name: Assert analytics.js still emits every event the dashboard reads
        run: |
          python3 - <<'PY'
          import pathlib, sys

          REQUIRED = [
              "passed-hero", "scroll-depth", "section-reached", "card-click",
              "resume-open", "email-copied", "social-click", "time-on-page",
              "resume-click", "email-click", "outbound",
          ]

          f = pathlib.Path("analytics.js")
          if not f.exists():
              sys.exit("FAIL: analytics.js is missing from the repo root.")

          src = f.read_text(encoding="utf-8", errors="ignore")

          missing = [n for n in REQUIRED if f'"{n}"' not in src and f"'{n}'" not in src]

          # The live script tag points data-before-send at this function. If it
          # is undefined the tag silently does nothing and / and /index.html
          # are counted as two separate pages.
          if "pfBeforeSend" not in src:
              missing.append("pfBeforeSend (function definition)")

          if missing:
              print(f"analytics.js is {len(src)} bytes and is missing:")
              for n in missing:
                  print(f"  - {n}")
              sys.exit(
                  "\nFAIL: analytics.js has lost events the dashboard depends on.\n"
                  "This is what a flattened upload looks like. Restore the full\n"
                  "script before merging — do not delete names from the list."
              )

          print(f"OK: analytics.js ({len(src)} bytes) emits all {len(REQUIRED)} required events.")
          PY

      # The injector only writes a tag when the Umami host is ABSENT from a
      # file. So changing UMAMI_ID above does not rewrite pages that already
      # carry a tag — they keep reporting to the old website while the build
      # goes green and the dashboard, pointed at the new one, looks empty.
      # That failure is invisible from every side, so it gets its own check.
      - name: Assert every page reports to the configured website
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          want = os.environ["UMAMI_ID"]

          files = [f for f in sorted(pathlib.Path(".").rglob("*.html"))
                   if ".github" not in f.parts and "node_modules" not in f.parts
                   and "assets" not in f.parts
                   and f.name != "dashboard.html"]

          wrong, tagged, untagged = [], [], []

          for f in files:
              html = f.read_text(encoding="utf-8", errors="ignore")
              if 'http-equiv="refresh"' in html or "location.replace(" in html:
                  continue
              ids = re.findall(r'data-website-id="([^"]*)"', html)
              if not ids:
                  # The injector adds the tag with the right id on this run.
                  untagged.append(str(f))
                  continue
              for got in ids:
                  if got != want:
                      wrong.append((str(f), got))
                  else:
                      tagged.append(str(f))

          for f in untagged:
              print(f"note     {f}  has no tag yet; the injector will add it")

          if wrong:
              print(f"\nexpected website id: {want}")
              for f, got in wrong:
                  print(f"  MISMATCH {f}  ->  {got}")
              sys.exit(
                  "\nFAIL: pages are reporting to a different website than the one "
                  "configured.\nThe injector will NOT fix this: it only adds a tag "
                  "when none is present.\nEdit data-website-id in the files above, "
                  "or change UMAMI_ID back."
              )

          print(f"OK: {len(tagged)} pages report to {want}.")
          PY

      - name: Fix script tags
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          # Read from the job env, not from a second copy of the literal. Two
          # hardcoded ids in one file is how they drift apart.
          UMAMI_HOST = os.environ["UMAMI_HOST"]
          UMAMI_ID   = os.environ["UMAMI_ID"]

          TAGS = (
              f'<script defer src="https://{UMAMI_HOST}/script.js" '
              f'data-website-id="{UMAMI_ID}"></script>\n'
              '<script defer src="./analytics.js"></script>\n'
          )

          root = pathlib.Path(".")

          print("--- what is actually here ---")
          for p in sorted(root.iterdir()):
              print(("DIR  " if p.is_dir() else "FILE ") + p.name)
          print("-----------------------------\n")

          # dashboard.html is excluded on purpose: it reports on this site's
          # traffic, so injecting the tracker into it would mean opening the
          # dashboard pollutes the numbers the dashboard is showing.
          files = [f for f in sorted(root.rglob("*.html"))
                   if ".github" not in f.parts and "node_modules" not in f.parts
                   and "assets" not in f.parts
                   and f.name != "dashboard.html"]

          if not files:
              print("No .html files found anywhere in the repo.")

          changed = []

          for f in files:
              html = f.read_text(encoding="utf-8", errors="ignore")
              before = html

              if 'http-equiv="refresh"' in html or "location.replace(" in html:
                  print(f"skip     {f}  (redirect stub)")
                  continue

              # remove any old cloud tag
              html = re.sub(
                  r'\s*<script[^>]*umami-git-master-lkb2\.vercel\.app[^>]*>\s*</script>',
                  '', html, flags=re.IGNORECASE)

              # add current tags if missing
              if UMAMI_HOST not in html:
                  m = re.search(r"</head\s*>", html, flags=re.IGNORECASE)
                  if not m:
                      print(f"WARNING  {f}  has no </head> — left untouched")
                      continue
                  html = html[:m.start()] + TAGS + html[m.start():]

              if html != before:
                  f.write_text(html, encoding="utf-8")
                  changed.append(str(f))
                  print(f"fixed    {f}")
              else:
                  print(f"ok       {f}")

          print("\nUpdated:", ", ".join(changed) if changed else "nothing")
          PY

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: point analytics at self-hosted umami"
          git push
