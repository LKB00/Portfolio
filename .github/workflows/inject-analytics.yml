name: Inject analytics tags

# Finds every .html file in the repo, removes any old Umami Cloud tag,
# and adds the self-hosted tag if missing. No folder name assumptions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Fix script tags
        run: |
          python3 - <<'PY'
          import pathlib, re

          UMAMI_HOST = "umami-swart-five.vercel.app"
          UMAMI_ID   = "5a59e8a0-e996-42f4-a248-fcf582413c76"

          TAGS = (
              f'<script defer src="https://{UMAMI_HOST}/script.js" '
              f'data-website-id="{UMAMI_ID}"></script>\n'
              '<script defer src="./analytics.js"></script>\n'
          )

          root = pathlib.Path(".")

          print("--- what is actually here ---")
          for p in sorted(root.iterdir()):
              print(("DIR  " if p.is_dir() else "FILE ") + p.name)
          print("-----------------------------\n")

          files = [f for f in sorted(root.rglob("*.html"))
                   if ".github" not in f.parts and "node_modules" not in f.parts]

          if not files:
              print("No .html files found anywhere in the repo.")

          changed = []

          for f in files:
              html = f.read_text(encoding="utf-8", errors="ignore")
              before = html

              if 'http-equiv="refresh"' in html or "location.replace(" in html:
                  print(f"skip     {f}  (redirect stub)")
                  continue

              # remove any old cloud tag
              html = re.sub(
                  r'\s*<script[^>]*cloud\.umami\.is[^>]*>\s*</script>',
                  '', html, flags=re.IGNORECASE)

              # add current tags if missing
              if UMAMI_HOST not in html:
                  m = re.search(r"</head\s*>", html, flags=re.IGNORECASE)
                  if not m:
                      print(f"WARNING  {f}  has no </head> — left untouched")
                      continue
                  html = html[:m.start()] + TAGS + html[m.start():]

              if html != before:
                  f.write_text(html, encoding="utf-8")
                  changed.append(str(f))
                  print(f"fixed    {f}")
              else:
                  print(f"ok       {f}")

          print("\nUpdated:", ", ".join(changed) if changed else "nothing")
          PY

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: point analytics at self-hosted umami"
          git push
