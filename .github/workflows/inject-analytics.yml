name: Inject analytics tags

# Keeps the tracking tags correct on every HTML page.
# - Removes any old Umami Cloud tag left behind
# - Adds the self-hosted tag if it is missing
# Safe to run repeatedly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Fix script tags
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          UMAMI_HOST = "umami-git-master-lkb2.vercel.app"
          UMAMI_ID   = "5a59e8a0-e996-42f4-a248-fcf582413c76"

          TAGS = (
              f'<script defer src="https://{UMAMI_HOST}/script.js" '
              f'data-website-id="{UMAMI_ID}"></script>\n'
              '<script defer src="./analytics.js"></script>\n'
          )

          folder = pathlib.Path("Portfolio")
          if not folder.is_dir():
              print("No Portfolio folder found. Nothing to do.")
              sys.exit(0)

          changed = []

          for f in sorted(folder.glob("*.html")):
              html = f.read_text(encoding="utf-8", errors="ignore")
              before = html

              # Skip redirect stubs — visitors leave before anything loads.
              if 'http-equiv="refresh"' in html or "location.replace(" in html:
                  print(f"skip     {f.name}  (redirect stub)")
                  continue

              # 1. Strip any old Umami Cloud tag.
              html = re.sub(
                  r'\s*<script[^>]*cloud\.umami\.is[^>]*>\s*</script>',
                  '', html, flags=re.IGNORECASE)

              # 2. Add the current tags if the host is not already there.
              if UMAMI_HOST not in html:
                  m = re.search(r"</head\s*>", html, flags=re.IGNORECASE)
                  if not m:
                      print(f"WARNING  {f.name}  has no </head> — left untouched")
                      continue
                  html = html[:m.start()] + TAGS + html[m.start():]

              if html != before:
                  f.write_text(html, encoding="utf-8")
                  changed.append(f.name)
                  print(f"fixed    {f.name}")
              else:
                  print(f"ok       {f.name}")

          if changed:
              print("\nUpdated:", ", ".join(changed))
          else:
              print("\nAll pages already correct.")
          PY

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: point analytics at self-hosted umami"
          git push
