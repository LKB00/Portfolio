<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs><clipPath id="runClip"><rect width="1600" height="900"></rect></clipPath>
<clipPath id="runShot"><rect x="300" y="141" width="1000" height="618" rx="26"></rect></clipPath>
<filter id="runPastel"><feColorMatrix type="saturate" values="0.42"></feColorMatrix></filter>
<filter id="runShadow" x="-14%" y="-14%" width="132%" height="142%"><feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#0A2C44" flood-opacity=".34"></feDropShadow></filter></defs>
<g clip-path="url(#runClip)">
<g filter="url(#runPastel)"><image href="assets/runable-sky.png" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"></image></g>
<rect width="1600" height="900" fill="#FFFFFF" fill-opacity=".30"></rect>
<g data-frame="" style="transform-box:fill-box;transform-origin:center"><g filter="url(#runShadow)"><rect x="300" y="141" width="1000" height="618" rx="26" fill="#FFFFFF"></rect></g>
<g clip-path="url(#runShot)"><image href="assets/runable-app.png" x="300" y="141" width="1000" height="618" preserveAspectRatio="xMidYMid slice"></image></g>
<rect x="300" y="141" width="1000" height="618" rx="26" fill="none" stroke="#0A2C44" stroke-opacity=".08" stroke-width="2"></rect></g>
<rect data-veil="" width="1600" height="900" fill="#0A1420" fill-opacity="0" style="pointer-events:none"></rect>
</g>
</svg>